<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">

<body>
    <!-- プログラムの始まり -->
    <script>
        //　アルゴリズムで　10 → a
        //　変数は左において、そこ入れられる。
        //行末は「；」 (セミコロン) を置く
        a = 10;
        //結果を表示する
        //日本語を書くときは、半角の”か’で囲む
        console.log("aの値は" + a);

        //10 ・・・変わらない数を定数
        //a  ・・・入れる値で内容が変わる変数
        
        //最近では、変数を使うときに使用する宣言を書く
        //定数の場合,constキーワードを使う
        const PI=3.14;
        //変数の場合、let, varを使用する
        var a = 10;
        // let a = 10;


        // 例:円の面積
        var r = 10;
        let S = PI * r * r ;
        console.log( "半径10の面積は" + S);
        // 変数名などのキーワードは大文字と小文字が区別される。

        // 2回目に登場する変数にlet,varは不要
        r = 11;
        S = PI * r * r ;
        console.log( "半径11の面積は" + S);

        //  足し算
        var ans = 1 + 1 ;
        console.log( "1+1 :" + ans );
        
        // 引き算
        ans = 2 - 3;
        ans = a - 10;

        // 掛け算
        ans = 2 * 10;

        // 割り算
        ans = 100 / 3;
        console.log()

    </script>
</body>

</html>
